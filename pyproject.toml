[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platformer-lab"
version = "0.1.0"
description = "AI-native 2D platformer lab with deterministic simulation, RL benchmarks, procedural content, adaptive difficulty, and deployable agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5,<3",
]

[project.scripts]
platformer-benchmark = "scripts.benchmark_scripted:main"
platformer-rl-check = "scripts.validate_rl_readiness:main"
platformer-train-ppo = "scripts.train_ppo:main"
platformer-evaluate-ppo = "scripts.evaluate_ppo:main"
platformer-play-ppo = "scripts.play_ppo:main"
platformer-export-ppo = "scripts.export_ppo:main"
platformer-build-tinyinfer = "scripts.build_tinyinfer_bridge:main"
platformer-validate-tinyinfer = "scripts.validate_tinyinfer:main"
platformer-benchmark-deployment = "scripts.benchmark_deployment:main"
platformer-audit-gameplay = "scripts.audit_gameplay:main"
platformer-accept-mixed = "scripts.accept_mixed_checkpoint:main"
platformer-diagnose-ppo = "scripts.diagnose_ppo:main"
platformer-verify-stage-entry = "scripts.verify_stage_entry:main"
platformer-validate-level = "scripts.validate_level_spec:main"
platformer-export-level = "scripts.export_level_spec:main"
platformer-play-level = "scripts.play_level_spec:main"
platformer-search-route = "scripts.search_level_route:main"
platformer-replay-route = "scripts.replay_level_route:main"

[project.optional-dependencies]
content = [
    "pydantic>=2,<3",
]
benchmark = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
]
training = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
    "stable-baselines3>=2.4,<3",
    "torch>=2.2,<3",
]
deployment = [
    "numpy>=1.26,<3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
inference = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
include = ["ai_platformer*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
